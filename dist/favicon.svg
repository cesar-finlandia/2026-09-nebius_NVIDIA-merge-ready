<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Merge-Ready mark">
  <!-- The branch tip: one diff, entering the gate. -->
  <circle cx="7.5" cy="12" r="3.25" fill="currentColor"/>
  <!-- The verdict: a checkmark that is also a merge - the branch descends to the
       junction and rises into the trunk. Only green gets drawn. -->
  <path d="M7.5 12 L14 21.5 L25.5 7.5" stroke="currentColor" stroke-width="3.25"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
